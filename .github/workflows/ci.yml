name: CI
on:
  push:
    branches: [main, "batch/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test (Docker is available for Testcontainers)
        run: ./mvnw -B clean verify
