spring:
  application:
    name: ireconciliation
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ireconciliation}
    username: ${DB_USER:ireconciliation}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
